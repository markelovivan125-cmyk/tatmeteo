<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админка</title>
    <style>
        body { background: #0a0a0a; color: #eee; font-family: sans-serif; padding: 20px; }
        button { background: #4a7fe8; color: #fff; border: 0; padding: 8px 12px; cursor: pointer; border-radius: 5px; margin: 2px; }
        .del { background: #ff5252; }
        ul { list-style: none; padding: 0; }
        li { background: #1a1a1a; padding: 10px; margin-bottom: 5px; border-radius: 5px; font-family: monospace; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-0 { background: #333; color: #888; }
        .badge-1 { background: #b71c1c; color: #ef9a9a; }
        .err { color: #ff5252; font-family: monospace; background: #2a0000; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Админ-панель</h1>
    <button id="gen">Сгенерировать пароль</button>
    <div id="list"></div>

    <script>
        async function load() {
            try {
                const res = await fetch('/api/admin');
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({ error: 'Неизвестная ошибка сервера' }));
                    document.getElementById('list').innerHTML = `<div class="err">Ошибка сервера: ${errData.error}<br><br>Проверьте, создана ли база данных KV в настройках Vercel!</div>`;
                    return;
                }
                const data = await res.json();
                
                let html = '<h2>Активные пароли:</h2><ul>';
                if (data.passwords.length === 0) {
                    html += '<li>Паролей пока нет. Сгенерируйте новый.</li>';
                }
                data.passwords.forEach(p => {
                    const badgeClass = `badge-${p.activeDevices}`;
                    let statusText = `${p.activeDevices}/1 устр.`;
                    
                    html += `<li>
                        <b>${p.password}</b> 
                        <span class="badge ${badgeClass}">${statusText}</span>
                        <span style="color:#888; font-size:12px; margin-left:10px;">${p.ips || 'Нет подключений'}</span>
                        <button class="del" style="float:right;" onclick="del('${p.password}')">Удалить</button>
                    </li>`;
                });
                html += '</ul><h2>Логи (последние 20):</h2><ul>';
                if (data.logs.length === 0) {
                    html += '<li>Логов нет.</li>';
                }
                data.logs.forEach(l => html += `<li>${l}</li>`);
                html += '</ul>';
                document.getElementById('list').innerHTML = html;
            } catch (e) {
                document.getElementById('list').innerHTML = `<div class="err">Сбой сети: ${e.message}</div>`;
            }
        }

        document.getElementById('gen').onclick = async () => {
            await fetch('/api/admin', { 
                method: 'POST', 
                headers: {'Content-Type':'application/json'}, 
                body: JSON.stringify({ action: 'generate' }) 
            });
            load();
        };

        async function del(pass) {
            await fetch('/api/admin', { 
                method: 'POST', 
                headers: {'Content-Type':'application/json'}, 
                body: JSON.stringify({ action: 'delete', password: pass }) 
            });
            load();
        }

        load();
        setInterval(load, 5000); // Автообновление каждые 5 секунд
    </script>
</body>
</html>
