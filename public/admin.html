<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #0a0a0a; color: #eee; font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        h1 { border-bottom: 1px solid #333; padding-bottom: 10px; }
        button { background: #4a7fe8; color: #fff; border: 0; padding: 8px 12px; cursor: pointer; border-radius: 5px; margin: 2px; }
        .del { background: #ff5252; }
        ul { list-style: none; padding: 0; }
        li { background: #1a1a1a; padding: 15px; margin-bottom: 10px; border-radius: 8px; font-family: monospace; border-left: 4px solid #333; }
        li.active-pass { border-left-color: #ff5252; }
        .pass-name { font-size: 16px; font-weight: bold; color: #fff; display: block; margin-bottom: 8px; }
        .device-info { font-size: 14px; color: #ccc; }
        .device-info b { color: #fff; }
        .status-free { color: #69f0ae; }
        .status-busy { color: #ff5252; font-weight: bold; }
        .ip-list { color: #aaa; font-size: 12px; margin-top: 4px; }
        .err { color: #ff5252; manrope: monospace; background: #2a0000; padding: 10px; border-radius: 5px; white-space: pre-wrap; word-wrap: break-word; }
        .summary { background: #111; padding: 10px 15px; border-radius: 5px; margin-bottom: 20px; font-size: 14px; color: #7ab4ff; border: 1px solid #333; }
        #login-box { background: #1a1a1a; padding: 30px; border-radius: 8px; max-width: 400px; margin: 50px auto; text-align: center; }
        #login-box input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0a0a0a; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>
    <h1>Админ-панель</h1>

    <div id="login-box" style="display: none;">
        <h3>🔒 Вход для администратора</h3>
        <input type="password" id="master-pass" placeholder="Введите мастер-пароль">
        <button id="login-btn" style="width: 100%;">Войти</button>
        <div class="err" id="login-err" style="margin-top: 10px; background: transparent;"></div>
    </div>

    <div id="dashboard" style="display: none;">
        <div class="summary" id="summary">Загрузка статистики...</div>
        <button id="gen">➕ Сгенерировать новый пароль</button>
        <div id="list" style="margin-top: 20px;"></div>
    </div>

    <script>
        async function checkAuth() {
            try {
                const res = await fetch('/api/admin');
                if (res.ok) {
                    document.getElementById('login-box').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    load();
                } else {
                    document.getElementById('login-box').style.display = 'block';
                    document.getElementById('dashboard').style.display = 'none';
                }
            } catch (e) {
                document.getElementById('login-box').style.display = 'block';
            }
        }

        document.getElementById('login-btn').onclick = async () => {
            const pass = document.getElementById('master-pass').value;
            const errBox = document.getElementById('login-err');
            errBox.style.display = 'none';

            const res = await fetch('/api/admin?action=admin_login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ masterPassword: pass })
            });

            if (res.ok) {
                checkAuth();
            } else {
                const data = await res.json();
                errBox.textContent = data.error || 'Ошибка входа';
                errBox.style.display = 'block';
            }
        };

        async function load() {
            try {
                const res = await fetch('/api/admin');
                if (!res.ok) { checkAuth(); return; }
                const data = await res.json();
                
                let totalPasswords = data.passwords.length;
                let totalActiveDevices = 0;
                data.passwords.forEach(p => { totalActiveDevices += p.activeDevices; });
                document.getElementById('summary').innerHTML = `📊 Всего паролей: <b>${totalPasswords}</b> | 👥 Устройств онлайн: <b>${totalActiveDevices}</b>`;

                let html = '<h2>Список паролей:</h2><ul>';
                if (data.passwords.length === 0) html += '<li>Паролей пока нет. Сгенерируйте новый.</li>';
                
                data.passwords.forEach(p => {
                    const isBusy = p.activeDevices > 0;
                    const statusText = isBusy ? `<span class="status-busy">🟥 ИСПОЛЬЗУЕТСЯ</span>` : `<span class="status-free">🟩 СВОБОДЕН</span>`;
                    html += `<li class="${isBusy ? 'active-pass' : ''}">
                        <span class="pass-name">🔑 Пароль: ${p.password}</span>
                        <div class="device-info">Статус: ${statusText}<br>Устройств онлайн: <b>${p.activeDevices}</b> из <b>1</b></div>
                        <div class="ip-list">IP: ${p.ips || '— нет подключений —'}</div>
                        <button class="del" style="margin-top:10px;" onclick="del('${p.password}')">🗑 Удалить пароль</button>
                    </li>`;
                });
                html += '</ul><h2>Логи (последние 20):</h2><ul>';
                if (data.logs.length === 0) html += '<li>Логов нет.</li>';
                data.logs.forEach(l => html += `<li style="padding: 8px; font-size: 12px;">${l}</li>`);
                html += '</ul>';
                
                document.getElementById('list').innerHTML = html;
            } catch (e) {
                document.getElementById('list').innerHTML = `<div class="err">Сбой сети: ${e.message}</div>`;
            }
        }

        document.getElementById('gen').onclick = async () => {
            const btn = document.getElementById('gen');
            btn.textContent = 'Генерация...';
            btn.disabled = true;
            try {
                await fetch('/api/admin', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ action: 'generate' }) });
                load();
            } finally {
                btn.textContent = '➕ Сгенерировать новый пароль';
                btn.disabled = false;
            }
        };

        async function del(pass) {
            if (confirm('Удалить этот пароль?')) {
                await fetch('/api/admin', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ action: 'delete', password: pass }) });
                load();
            }
        }

        checkAuth();
        setInterval(load, 5000);
    </script>
</body>
</html>
