<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админка</title>
    <style>
        body { background: #0a0a0a; color: #eee; font-family: sans-serif; padding: 20px; }
        button { background: #4a7fe8; color: #fff; border: 0; padding: 8px 12px; cursor: pointer; border-radius: 5px; margin: 2px; }
        .del { background: #ff5252; }
        ul { list-style: none; padding: 0; }
        li { background: #1a1a1a; padding: 10px; margin-bottom: 5px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Админ-панель</h1>
    <button id="gen">Сгенерировать пароль</button>
    <div id="list"></div>

    <script>
        const SECRET = 'super-admin-key'; // Тот же ключ, что в api/admin.js

        async function load() {
            const res = await fetch(`/api/admin?secret=${SECRET}`);
            if (!res.ok) { document.body.innerHTML = 'Доступ запрещен'; return; }
            const data = await res.json();

            let html = '<h2>Активные пароли:</h2><ul>';
            data.passwords.forEach(p => {
                html += `<li><b>${p.password}</b> - ${p.inUse ? '🟥 ЗАНЯТ ('+p.ip+')' : '🟩 Свободен'}
                         <button class="del" onclick="del('${p.password}')">Удалить</button></li>`;
            });
            html += '</ul><h2>Логи (последние 20):</h2><ul>';
            data.logs.forEach(l => html += `<li>${l}</li>`);
            html += '</ul>';
            document.getElementById('list').innerHTML = html;
        }

        document.getElementById('gen').onclick = async () => {
            await fetch('/api/admin', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({secret: SECRET, action: 'generate'})
            });
            load();
        };

        async function del(pass) {
            await fetch('/api/admin', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({secret: SECRET, action: 'delete', password: pass})
            });
            load();
        }

        load();
        setInterval(load, 5000); // Автообновление каждые 5 секунд
    </script>
</body>
</html>
