<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2х2 | Вход</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0; padding: 0; background: #121212; color: #e0e0e0;
      font-family: 'Inter', sans-serif; height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .auth-box {
      background: #1e1e1e; border: 1px solid #333;
      border-radius: 8px; padding: 30px; width: 100%; max-width: 360px;
      text-align: center;
    }
    .auth-logo {
      font-size: 28px; font-weight: 700; color: #ffffff; margin-bottom: 5px;
    }
    .auth-subtitle {
      font-size: 12px; letter-spacing: 1px;
      color: #888; margin-bottom: 25px; text-transform: uppercase;
    }
    .auth-form input {
      width: 100%; box-sizing: border-box; background: #2a2a2a;
      border: 1px solid #444; color: #ffffff;
      padding: 12px 15px; border-radius: 6px; font-size: 15px;
      margin-bottom: 15px; outline: none; transition: 0.2s;
    }
    .auth-form input:focus {
      border-color: #4a7fe8;
    }
    .auth-captcha-box { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
    .auth-captcha-img {
      flex: 1; height: 48px; background: #2a2a2a; border: 1px solid #444;
      border-radius: 6px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; overflow: hidden;
    }
    .auth-captcha-img svg { width: 100%; height: 100%; }
    .auth-captcha-box input {
      width: 90px; margin-bottom: 0; text-align: center; text-transform: uppercase;
      font-weight: 700; color: #ffffff;
    }
    .auth-btn {
      width: 100%; padding: 12px; background: #4a7fe8; color: #ffffff;
      border: 0; border-radius: 6px; font-weight: 600; font-size: 15px;
      cursor: pointer; transition: 0.2s;
    }
    .auth-btn:hover { background: #3a6fd8; }
    .auth-error { color: #ff5252; font-size: 13px; margin-top: 15px; display: none; }
  </style>
</head>
<body>
  <div class="auth-box">
    <div class="auth-logo">2х2 | РАДАР</div>
    <div class="auth-subtitle">Вход в систему</div>
    <form id="auth-form" class="auth-form">
      <input type="password" id="pass" placeholder="Введите пароль" required autocomplete="off">
      <div class="auth-captcha-box">
        <div id="captcha-img" class="auth-captcha-img" title="Обновить код"></div>
        <input type="text" id="captcha" placeholder="Код" required maxlength="5" autocomplete="off">
      </div>
      <button type="submit" class="auth-btn">ВОЙТИ</button>
      <div id="err" class="auth-error"></div>
    </form>
  </div>

  <script>
    let currentCaptchaId = null;

    async function loadCaptcha() {
      try {
        const res = await fetch('/api/captcha');
        const data = await res.json();
        currentCaptchaId = data.id;
        document.getElementById('captcha-img').innerHTML = data.svg;
      } catch (e) { console.error('Ошибка загрузки капчи:', e); }
    }

    document.getElementById('captcha-img').addEventListener('click', loadCaptcha);

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = document.getElementById('pass').value;
      const captchaCode = document.getElementById('captcha').value;
      const errBox = document.getElementById('err');
      const btn = e.target.querySelector('.auth-btn');
      
      errBox.style.display = 'none';
      btn.textContent = 'ПРОВЕРКА...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth?action=login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass, captchaId: currentCaptchaId, captchaCode: captchaCode })
        });
        const data = await res.json();

        if (data.success) {
          window.location.href = '/';
        } else {
          errBox.textContent = data.error || 'Ошибка авторизации';
          errBox.style.display = 'block';
          loadCaptcha();
        }
      } catch (err) {
        errBox.textContent = 'Сбой сети. Попробуйте снова.';
        errBox.style.display = 'block';
        loadCaptcha();
      } finally {
        btn.textContent = 'ВОЙТИ';
        btn.disabled = false;
      }
    });

    loadCaptcha();
  </script>
</body>
</html>
