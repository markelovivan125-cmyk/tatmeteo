<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Baltrad | Радар</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="map"></div>

<!-- CTRL -->
<div class="panel" id="ctrl">
  <button class="btn on" id="btn-layer">Слой: RAIN</button><div class="sep"></div>
  <button class="btn" id="btn-refresh">↺ Обновить</button><button class="btn" id="spd">1×</button><div class="sep"></div>
  <button class="btn" id="btn-locate" title="Мое местоположение">📍</button>
  <div class="sep"></div>
  <button class="btn" style="background:0 0;border:0;color:#888;font-size:15px;padding:4px 6px" title="Скрыть панель" onclick="closePanel('ctrl')">✕</button>
</div>
<button class="restore-btn" id="restore-ctrl" style="top:14px;left:14px" onclick="restorePanel('ctrl')">🎛 Панель</button>

<!-- LEGEND -->
<div class="panel" id="legend">
  <div id="legend-header">
    <h3 id="ltitle">ЛЕГЕНДА</h3>
    <div style="display:flex;align-items:center;gap:4px">
      <button id="toggle-legend-btn">−</button>
      <button style="background:0 0;border:0;color:#888;font-size:15px" onclick="closePanel('legend')" title="Скрыть">✕</button>
    </div>
  </div>
  <div id="lbody">
    <img id="legend-img" alt="Легенда недоступна">
  </div>
</div>
<button class="restore-btn" id="restore-legend" style="bottom:80px;right:14px" onclick="restorePanel('legend')">📊 Легенда</button>

<!-- TIMELINE -->
<div class="panel" id="tl">
  <button style="position:absolute;top:6px;right:6px;background:0 0;border:0;color:#888;font-size:15px" title="Скрыть" onclick="closePanel('tl')">✕</button>
  <button id="playbtn">&#x25B6;</button>
  <div id="track">
    <div id="tfill"></div><div id="tthumb"></div><div id="tlbls"></div>
    <div id="time-tooltip">
      <div class="tt-time">--:--</div><div class="tt-date">--</div><div class="tt-diff">сейчас</div>
    </div>
  </div>
  <button class="btn" id="b-minus1h">-1ч</button>
  <button class="btn" id="b-minus10m">-10м</button>
  <button class="btn" id="b-plus10m">+10м</button>
</div>
<button class="restore-btn" id="restore-tl" style="bottom:14px;left:50%;transform:translateX(-50%)" onclick="restorePanel('tl')">⏱ Таймлайн</button>

<div id="pulse"></div>
<div id="dbg"></div>
<div id="url-debug"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
